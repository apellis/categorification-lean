name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache key
        id: key
        run: |
          echo "toolchain=build-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}" >> "$GITHUB_OUTPUT"
          echo "prefix=build-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}" >> "$GITHUB_OUTPUT"
          echo "legacy=build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}" >> "$GITHUB_OUTPUT"

      # A change touching only Markdown files cannot affect the Lean build.
      - name: Detect documentation-only change
        id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if files=$(git diff --name-only "$base" HEAD 2>/dev/null) && [ -n "$files" ] \
              && ! printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Only Markdown files changed; skipping the Lean build."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      # The axiom audit and the non-vacuity checks see only modules imported by the root file.
      # The root file holds one plain import per line and nothing else, so comparing its text
      # with the source tree agrees with Lean's own parse of the imports. The axiom audit
      # repeats the comparison against the loaded module table.
      - name: Root file imports every module
        run: |
          malformed=$(grep -nvE '^import Categorification(\.[A-Za-z0-9_]+)+$' Categorification.lean || true)
          if [ -n "$malformed" ]; then
            echo "Categorification.lean must hold one plain import per line and nothing else:"
            echo "$malformed"
            exit 1
          fi
          missing=$(comm -13 <(sed 's/^import //' Categorification.lean | sort) \
            <(find Categorification -name '*.lean' | sed 's/\.lean$//; s#/#.#g' | sort))
          if [ -n "$missing" ]; then
            echo "Modules not imported by Categorification.lean:"
            echo "$missing"
            exit 1
          fi

      - name: Install elan
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Fetches the pinned dependencies and Mathlib's prebuilt oleans.
      - name: Fetch dependencies and Mathlib cache
        if: steps.scope.outputs.docs_only != 'true'
        run: lake exe cache get

      # Build outputs of this package and of the two sibling dependencies, saved by the
      # last master build; Lake rebuilds only modules whose inputs changed. After a pin bump
      # (new manifest) fall back to the newest entry for the toolchain: oleans of modules the
      # bump does not touch stay valid. The `legacy` key is the scheme used before 2026-10-17.
      - name: Restore build cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/LieLean/.lake/build
            .lake/packages/StringDiagrams/.lake/build
            .lake/packages/DG/.lake/build
          key: ${{ steps.key.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.key.outputs.prefix }}-
            ${{ steps.key.outputs.legacy }}-
            ${{ steps.key.outputs.toolchain }}-

      - name: Build
        if: steps.scope.outputs.docs_only != 'true'
        run: lake build --wfail

      - name: Axiom audit
        if: steps.scope.outputs.docs_only != 'true'
        run: lake env lean -DwarningAsError=true scripts/AxiomAudit.lean

      - name: Integral descent consumer
        if: steps.scope.outputs.docs_only != 'true'
        run: lake env lean -DwarningAsError=true scripts/IntegralDescentCheck.lean

      - name: Non-vacuity checks
        if: steps.scope.outputs.docs_only != 'true'
        run: lake env lean -DwarningAsError=true scripts/NonVacuity.lean

      # Trusted bases of the specification files and the sanity checks of the definition cards.
      - name: Faithfulness checks
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          for f in scripts/Faithfulness/*.lean; do
            echo "== $f"
            lake env lean -DwarningAsError=true "$f"
          done

      # Only master builds write the cache, so pull requests cannot evict it.
      - name: Save build cache
        if: github.event_name != 'pull_request' && steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            .lake/packages/LieLean/.lake/build
            .lake/packages/StringDiagrams/.lake/build
            .lake/packages/DG/.lake/build
          key: ${{ steps.key.outputs.prefix }}-${{ github.sha }}
