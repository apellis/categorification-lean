name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "--wfail"
      - name: Axiom audit
        run: lake env lean -DwarningAsError=true scripts/AxiomAudit.lean
      - name: Integral descent consumer
        run: lake env lean -DwarningAsError=true scripts/IntegralDescentCheck.lean
